# Render Blueprint: one web service (this Dockerfile) + one Postgres. In Render: New > Blueprint > connect this repo.
# Plan names and free-tier limits change; check Render's current pricing before choosing a plan for real use.
databases:
  - name: temple-directory-db
    databaseName: temple_directory
    plan: free

services:
  - type: web
    name: global-temple-directory
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: temple-directory-db
          property: connectionString
      - key: BASE_URL
        sync: false        # set to your public URL, e.g. https://global-temple-directory.onrender.com
      # Email verification is switched off for now (sign-in = name + email, stored, not checked). These are only needed
      # if you re-enable it (see server/routes/auth.js):
      #   ADMIN_EMAILS, MAIL_API_KEY, MAIL_FROM
      # Dummy admin: OFF in production. Setting ALLOW_DEV_ADMIN=1 lets ANY visitor become an admin (private/demo sites only).
      # - key: ALLOW_DEV_ADMIN
      #   value: "1"
