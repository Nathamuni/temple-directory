.contribution-options{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:28px 0}.option{text-align:left;border:1px solid var(--line);border-radius:3px;background:#fffdf8;padding:19px;color:var(--ink)}.option strong{font:23px Georgia,serif;display:block;margin-bottom:10px}.option span{font-size:13px;color:var(--muted);line-height:1.5;display:block}.option.active{background:#e8eddf;border-color:var(--green);box-shadow:inset 0 3px var(--green)}.image-row{border-top:1px solid var(--line);padding:20px 0}.submitted-image{margin:15px 0;border:1px solid var(--line);background:#f3f1ea;overflow:hidden}.submitted-image img{width:100%;height:230px;object-fit:cover;display:block}.submitted-image figcaption{padding:12px;font-size:12px;overflow-wrap:anywhere}.image-error{padding:30px 18px;color:var(--muted);font-size:13px}.photo-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:24px}.source-card{padding:16px;background:#e9eddf;margin-top:15px;font-size:13px}.source-card p{margin:6px 0}.form-error{color:#9d3c30;font-size:13px}.submission-facts{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-block:20px}.submission-facts dt{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}.submission-facts dd{margin:4px 0;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.card-photo{width:100%;height:100%;object-fit:cover}.cover-photo{width:100%;height:100%;object-fit:cover;border-radius:50% 50% 0 0}.card-art .badge{z-index:1}details summary{cursor:pointer;color:var(--green);margin:18px 0}.formlayout aside{align-self:start;position:sticky;top:20px}#new-temple[hidden]{display:none}@media(max-width:850px){.formlayout aside{position:static}.contribution-options{gap:8px}.option{padding:14px}.option strong{font-size:20px}}@media(max-width:520px){.contribution-options,.photo-gallery,.submission-facts{grid-template-columns:1fr}.submitted-image img{height:210px}.option span{font-size:12px}}

<header><div class="wrap"><a href="#discover" class="logo"><svg class="mark"><use href="#temple"/></svg>Temple Directory</a><nav aria-label="Main navigation"><button data-nav="discover" onclick="go('discover')">Explore</button><button data-nav="practices" onclick="go('practices')">Temple practices</button><button data-nav="workspace" onclick="go('workspace')">My contributions</button></nav><button class="btn small" onclick="go('contribute')">+ Contribute</button></div></header><div class="demo"><div class="wrap"><span>INTERACTIVE MVP · Wikipedia sourced profiles · Contributions saved on this browser</span><span>Workspace <select id="role" aria-label="Demo workspace" style="padding:2px 8px;font-size:12px" onchange="switchRole(this.value)"><option value="member">Member</option><option value="admin">Admin demo</option></select></span></div></div><main id="app"></main><footer><div class="wrap"><span class="serif">A living reference, enriched by people.</span><span>Two account categories · Members contribute. Admins publish.</span></div></footer><div id="toast" class="toast hidden" role="status"></div>
<script>
const seeds=[{id:'srirangam',name:'Sri Ranganathaswamy Temple',locality:'Srirangam, Tiruchirappalli',state:'Tamil Nadu',deity:'Vishnu',note:'A sample profile for exploring the directory and its contribution workflow.'},{id:'meenakshi',name:'Meenakshi Amman Temple',locality:'Madurai',state:'Tamil Nadu',deity:'Devi'},{id:'chidambaram',name:'Thillai Nataraja Temple',locality:'Chidambaram',state:'Tamil Nadu',deity:'Shiva'},{id:'tirupati',name:'Sri Venkateswara Temple',locality:'Tirumala',state:'Andhra Pradesh',deity:'Vishnu'},{id:'guruvayur',name:'Guruvayur Temple',locality:'Guruvayur',state:'Kerala',deity:'Krishna'},{id:'udupi',name:'Sri Krishna Matha',locality:'Udupi',state:'Karnataka',deity:'Krishna'}];
let submissions=[];try{submissions=JSON.parse(localStorage.getItem('temple-mvp-submissions')||'[]')}catch{}let role='member',mode='manual',query='',stateFilter='',deityFilter='';const app=document.querySelector('#app');const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function persist(){try{localStorage.setItem('temple-mvp-submissions',JSON.stringify(submissions))}catch{toast('Browser storage is unavailable; changes last for this session.')}}function toast(s){const t=document.querySelector('#toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.add('hidden'),3600)}function art(){return '<svg aria-hidden="true"><use href="#temple"/></svg>'}function temples(){return [...seeds,...submissions.filter(s=>s.status==='Published'&&s.mode==='manual').map(s=>({...s,id:s.id,locality:[s.locality,s.district].filter(Boolean).join(', ')}))]}function go(v){if(location.hash==='#'+v)render();else location.hash=v}function switchRole(v){role=v;go(v==='admin'?'admin':'workspace')}function opts(vals,selected){return vals.map(v=>`<option ${v===selected?'selected':''}>${esc(v)}</option>`).join('')}
function render(){let route=location.hash.slice(1)||'discover';document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===route));if(route.startsWith('temple/'))detail(route.split('/')[1].split('?')[0]);else if(route.startsWith('contribute'))contribute();else if(route==='workspace')workspace();else if(route==='admin')admin();else if(route==='practices')practices();else discover();window.scrollTo(0,0)}
function card(t){return `<article class="card"><div class="card-art"><span class="badge">${t.status==='Published'?'Member contributed':'Sample listing'}</span>${art()}</div><div class="card-body"><div class="location">${esc(t.locality)} · ${esc(t.state)}</div><h3>${esc(t.name)}</h3><div class="card-bottom"><span>${esc(t.deity||'Deity not provided')}</span><a href="#temple/${encodeURIComponent(t.id)}">Explore temple ↗</a></div></div></article>`}
function discover(){app.innerHTML=`<section class="hero wrap"><div><div class="eyebrow">Discover · Understand · Participate</div><h1>Every temple.<br>A story to preserve.</h1><p>Explore temple knowledge, discover local practices, and help build a thoughtful reference for everyone.</p><form class="searchbox" onsubmit="event.preventDefault();query=this.q.value;resultPage=1;updateResults();document.querySelector('#directory').scrollIntoView({behavior:'smooth'})"><input name="q" aria-label="Search temples" placeholder="Search a temple, deity or place" value="${esc(query)}"><button class="btn" type="submit">Search ↗</button></form><div class="strip"><span><strong>${temples().length}</strong> sample & added entries</span><span><strong>2</strong> account categories</span><span>Built together,<br>reviewed with care</span></div></div><div class="hero-art">${art()}<span>Temple architecture · an illustrative study</span></div></section><section id="directory" class="wrap"><div class="section-top"><div><div class="eyebrow">The temple gazetteer</div><h2>Begin your discovery</h2></div><span id="count" class="muted" style="font-size:13px"></span></div><div class="filter"><select aria-label="Filter by state" onchange="stateFilter=this.value;updateResults()"><option value="">All states</option>${opts(['Tamil Nadu','Andhra Pradesh','Kerala','Karnataka',...temples().map(t=>t.state).filter(x=>!['Tamil Nadu','Andhra Pradesh','Kerala','Karnataka'].includes(x))],stateFilter)}</select><select aria-label="Filter by deity" onchange="deityFilter=this.value;updateResults()"><option value="">All deities</option>${opts([...new Set(temples().map(t=>t.deity).filter(Boolean))],deityFilter)}</select><button class="textbtn" onclick="query='';stateFilter='';deityFilter='';discover()">Reset filters</button></div><div id="results" class="grid"></div><div class="banner"><div><div class="eyebrow">A small contribution matters</div><h2>Know a temple?<br>Help its story find a home.</h2><p>Add a few details or simply share an existing source. You can always enrich the profile later.</p><button class="btn secondary" onclick="go('contribute')">Add a temple or share a source ↗</button></div><div class="steps"><div><b>01</b><span>Share what<br>you know</span></div><div><b>02</b><span>Attach a source<br>or observation</span></div><div><b>03</b><span>Admin reviews<br>and publishes</span></div></div></div></section>`;updateResults()}
function updateResults(){const ts=temples().filter(t=>(!stateFilter||t.state===stateFilter)&&(!deityFilter||t.deity===deityFilter)&&[t.name,t.locality,t.state,t.deity].join(' ').toLowerCase().includes(query.toLowerCase()));document.querySelector('#count').textContent=ts.length+' entries';document.querySelector('#results').innerHTML=ts.length?ts.map(card).join(''):'<div class="empty full">No temples match. Try another place or reset the filters.</div>'}
function detail(id){const t=temples().find(t=>t.id===decodeURIComponent(id));if(!t){app.innerHTML='<div class="wrap page"><h2>Temple not found</h2><a href="#discover">Return to explore</a></div>';return}const references=submissions.filter(s=>s.status==='Published'&&s.temple===t.id);app.innerHTML=`<div class="wrap page"><a class="back" href="#discover">← All temples</a><div class="detail-head"><div><div class="eyebrow">${esc(t.state)} / ${esc(t.deity||'Temple')}</div><h1>${esc(t.name)}</h1><p class="muted">${esc(t.locality)}</p><div class="actions"><button class="btn" onclick="share()">Share temple ↗</button><button class="btn secondary" onclick="go('contribute?${encodeURIComponent(t.id)}')">Suggest an update</button></div></div><div class="detail-art">${art()}</div></div><div class="section-nav"><a href="#temple/${t.id}" onclick="event.preventDefault();document.querySelector('#overview').scrollIntoView()">Overview</a><a href="#temple/${t.id}" onclick="event.preventDefault();document.querySelector('#practices').scrollIntoView()">Practices</a><a href="#temple/${t.id}" onclick="event.preventDefault();document.querySelector('#references').scrollIntoView()">Sources</a></div><div class="detail-layout"><div><section id="overview"><h2>At a glance</h2><dl class="facts"><div><dt>Presiding deity</dt><dd>${esc(t.deity||'Not provided')}</dd></div><div><dt>State</dt><dd>${esc(t.state)}</dd></div><div><dt>Profile status</dt><dd>${t.status==='Published'?'Basic listing':'Demonstration'}</dd></div></dl><p>${esc(t.note||'This sample entry demonstrates how a temple profile is structured. Add sources to enrich its history and visiting information.')}</p><p class="notice">${t.status==='Published'?'This entry was approved in the browser-local demo. It has not received real platform verification.':'Illustrative profile. Visiting hours, rituals and historical claims have not been verified in this prototype.'}</p></section><section id="practices"><div class="section-top"><h2>Practices and participation</h2><button class="textbtn" onclick="share('practices')">Share section ↗</button></div><p class="muted">Worship guidance, pradakshina, cleanliness and prasadam belong here, with sources for each temple-specific instruction.</p>${references.filter(s=>s.mode==='practice').map(s=>`<div class="panel"><span class="badge">Community suggestion · demo reviewed</span><h3>${esc(s.name)}</h3><p>${esc(s.note)}</p></div>`).join('')||'<div class="panel"><h3>Help document local practices</h3><p>No temple-confirmed instructions are available in this sample. Share a source or a first-hand observation for review.</p><button class="textbtn" onclick="mode=\'practice\';go(\'contribute?'+encodeURIComponent(t.id)+'\')">Suggest a practice ↗</button></div>'}</section><section id="references"><h2>References and external sources</h2>${references.filter(s=>s.url).map(s=>`<div class="panel"><span class="eyebrow">Member shared source</span><h3>${esc(s.name)}</h3><p>${esc(s.note)}</p><a target="_blank" rel="noopener noreferrer" href="${esc(safeUrl(s.url))}">Open original source ↗</a>${youtube(s.url)?`<div style="margin-top:18px"><button class="btn secondary small" onclick="loadVideo(this,'${youtube(s.url)}')">Load YouTube embed</button><p class="help">Loading connects to YouTube. The source remains a reference, not a verified claim.</p></div>`:''}</div>`).join('')||'<p class="muted">No reviewed sources attached yet. Official websites, videos and documents can be submitted for review.</p>'}<button class="btn secondary" onclick="mode='source';go('contribute?${encodeURIComponent(t.id)}')">Share an existing source</button></section></div><aside><div class="panel"><div class="eyebrow">Information confidence</div><h3>Clear about what we know</h3><p class="muted">Each claim keeps its own source and review status. Publication alone does not verify every fact.</p><small>Sample architecture illustration; not a photograph of this temple.</small></div><div class="panel"><h3>Plan your visit</h3><p class="muted">Confirm current timings and local instructions with the temple before travelling.</p><a target="_blank" rel="noopener noreferrer" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(t.name+' '+t.locality)}">Search location on Maps ↗</a></div></aside></div></div>`;if(location.hash.includes('?section='))setTimeout(()=>document.getElementById(location.hash.split('?section=')[1])?.scrollIntoView(),20)}
function safeUrl(u){try{const v=new URL(u);return ['http:','https:'].includes(v.protocol)?v.href:'#'}catch{return '#'}}function youtube(u){try{const v=new URL(u);if(v.hostname==='youtu.be')return /^[\w-]{11}$/.test(v.pathname.slice(1))?v.pathname.slice(1):'';if(['www.youtube.com','youtube.com','m.youtube.com'].includes(v.hostname)){const id=v.searchParams.get('v')||v.pathname.split('/')[2];return /^[\w-]{11}$/.test(id||'')?id:''}}catch{}return ''}function loadVideo(b,id){const f=document.createElement('iframe');f.src='https://www.youtube-nocookie.com/embed/'+id;f.title='Member shared temple video';f.style='width:100%;aspect-ratio:16/9;border:0';f.allowFullscreen=true;b.replaceWith(f)}
async function share(section){const u=location.href.split('?')[0]+(section?'?section='+section:'');try{await navigator.clipboard.writeText(u);toast('Published page link copied')}catch{const a=document.createElement('textarea');a.value=u;document.body.append(a);a.select();document.execCommand('copy');a.remove();toast('Link copied')}}
function contribute(){const target=decodeURIComponent(location.hash.split('?')[1]||'');app.innerHTML=`<div class="wrap page"><div class="eyebrow">Member contribution</div><h2>Add knowledge, one source at a time.</h2><p class="muted">Start small. Every submission is reviewed before it changes a public page.</p><div class="tabs"><button class="${mode==='manual'?'active':''}" onclick="mode='manual';contribute()">Add a temple</button><button class="${mode==='source'?'active':''}" onclick="mode='source';contribute()">Share a source</button><button class="${mode==='practice'?'active':''}" onclick="mode='practice';contribute()">Suggest a practice</button></div><div class="formlayout"><form id="contribution" class="panel" onsubmit="event.preventDefault();submitForm('Pending review')"><div class="formgrid">${mode==='manual'?`<div class="full"><label for="name">Temple name *</label><input id="name" name="name" required placeholder="Name as known locally"></div><div><label for="state">State *</label><input id="state" name="state" required placeholder="e.g. Tamil Nadu"></div><div><label for="district">District *</label><input id="district" name="district" required></div><div><label for="locality">Locality or address *</label><input id="locality" name="locality" required></div><div><label for="deity">Presiding deity</label><input id="deity" name="deity" placeholder="Leave blank if unknown"></div>`:`<div class="full"><label for="temple">Related temple *</label><select style="width:100%" id="temple" name="temple" required><option value="">Choose temple</option>${temples().map(t=>`<option value="${t.id}" ${target===t.id?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div><div class="full"><label for="name">${mode==='source'?'Source title':'Practice title'} *</label><input id="name" name="name" required placeholder="${mode==='source'?'Official website, guide or video':'e.g. Approved cleanliness activities'}"></div>`}<div class="full"><label for="url">${mode==='source'?'Source link *':'Supporting source link'}</label><input id="url" name="url" type="url" ${mode==='source'?'required':''} placeholder="https://"><div id="preview" class="help">Website and document links become source cards. YouTube supports an optional embed after review.</div></div><div class="full"><label for="note">${mode==='manual'?'Source or first-hand observation note *':mode==='practice'?'Practice details and evidence *':'What does this source support? *'}</label><textarea id="note" name="note" required placeholder="Explain what you know and where it came from."></textarea></div><div class="full"><label for="relationship">Your connection to the temple</label><select name="relationship" id="relationship"><option>Community member</option><option>Temple management</option><option>Priest</option><option>Seva organiser</option></select><div class="help">Optional context. All contributors use the same Member permissions.</div></div><div class="full"><label><input type="checkbox" name="rights" required style="width:auto"> I can share this information and have provided its source or my observation.</label></div></div><div class="actions"><button class="btn" type="submit">Submit for review ↗</button><button class="btn secondary" type="button" onclick="submitForm('Draft')">Save draft</button></div></form><aside><div class="panel"><div class="eyebrow">Your contribution journey</div><h3>Simple to submit.<br>Careful to publish.</h3><p>1. Add available details</p><p>2. Attach a source</p><p>3. Admin checks and reviews</p><p>4. Approved details appear publicly</p></div><p class="notice">This is an interactive demo. No account authentication or server upload is connected. Contributions stay in this browser.</p></aside></div></div>`;document.querySelector('#url').addEventListener('input',e=>{const u=e.target.value;document.querySelector('#preview').textContent=youtube(u)?'YouTube recognized · Optional video embed available after approval.':u?'External source · Will be displayed as an original source link.':'Paste an existing source link.'})}
function submitForm(status){const f=document.querySelector('#contribution');if(status!=='Draft'&&!f.reportValidity())return;const o=Object.fromEntries(new FormData(f));if(!o.name){toast('Add a title before saving a draft.');return}if(o.url){try{if(!['https:','http:'].includes(new URL(o.url).protocol))throw Error()}catch{toast('Use a valid http or https source link.');return}}const duplicate=mode==='manual'&&temples().find(t=>t.name.toLowerCase()===o.name.trim().toLowerCase());if(duplicate&&status!=='Draft'){toast('A temple with that name exists. Share a source or propose a practice on its page.');return}submissions.unshift({...o,id:'entry-'+Date.now(),mode,status,date:new Date().toLocaleDateString(),reason:''});persist();toast(status==='Draft'?'Draft saved in this browser':'Submitted to the demo admin queue');go('workspace')}
function workspace(){app.innerHTML=`<div class="wrap page"><div class="eyebrow">Member workspace</div><div class="section-top"><div><h2>My contributions</h2><p class="muted">Your drafts, sources and proposed temple knowledge.</p></div><button class="btn" onclick="go('contribute')">+ New contribution</button></div><p class="notice">All entries shown belong to this browser’s demo workspace. A real member account is part of the production MVP.</p>${submissions.length?submissions.map(s=>record(s,false)).join(''):'<div class="empty"><h3>Your first contribution starts here.</h3><p class="muted">Share a temple you know or an existing reference.</p><button class="btn secondary" onclick="go(\'contribute\')">Start contributing</button></div>'}</div>`}
function record(s,review){return `<article class="record"><div class="row"><div><div class="eyebrow">${s.mode==='manual'?'New temple':s.mode==='source'?'External source':'Practice suggestion'}</div><h3>${esc(s.name)}</h3></div><span class="status">${esc(s.status)}</span></div><p class="review-text muted">${esc(s.note)}</p>${s.mode==='manual'?`<p><small>${esc(s.locality)} · ${esc(s.district)} · ${esc(s.state)} · ${esc(s.deity||'Deity unknown')}</small></p>`:`<p><small>Temple: ${esc(temples().find(t=>t.id===s.temple)?.name||'Not selected')}</small></p>`}${s.url?`<a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener noreferrer">Open submitted source ↗</a>`:''}<p class="help">${esc(s.relationship||'Community member')} · ${esc(s.date)}${s.reason?' · Reviewer note: '+esc(s.reason):''}</p><div class="actions">${review&&s.status==='Pending review'?`<button class="btn small" onclick="decide('${s.id}','Published')">Approve and publish</button><button class="btn secondary small" onclick="decide('${s.id}','Changes requested')">Request changes</button><button class="textbtn" onclick="decide('${s.id}','Rejected')">Reject</button>`:''}${!review&&['Draft','Changes requested'].includes(s.status)?`<button class="btn secondary small" onclick="resubmit('${s.id}')">Edit and submit</button><button class="textbtn" onclick="removeEntry('${s.id}')">Delete draft</button>`:''}${s.status==='Published'&&s.mode==='manual'?`<a href="#temple/${s.id}">View published demo page ↗</a>`:''}</div></article>`}
function resubmit(id){const s=submissions.find(s=>s.id===id);mode=s.mode;go('contribute'+(s.temple?'?'+s.temple:''));setTimeout(()=>{Object.entries(s).forEach(([k,v])=>{const el=document.querySelector('#contribution')?.elements[k];if(el&&el.type!=='checkbox')el.value=v});const f=document.querySelector('#contribution');f.onsubmit=e=>{e.preventDefault();if(!f.reportValidity())return;const o=Object.fromEntries(new FormData(f));if(o.url&&!/^https?:\/\//i.test(o.url)){toast('Use an http or https link');return}Object.assign(s,o,{status:'Pending review'});persist();toast('Updated submission sent for review');go('workspace')};const draft=f.querySelector('button[type="button"]');draft.onclick=()=>{Object.assign(s,Object.fromEntries(new FormData(f)),{status:'Draft'});persist();go('workspace')}},30)}function removeEntry(id){submissions=submissions.filter(s=>s.id!==id);persist();workspace();toast('Draft removed')}
function admin(){if(role!=='admin'){app.innerHTML='<div class="wrap page"><h2>Admin demo workspace</h2><p>Use the workspace selector to explore the admin review flow.</p><button class="btn" onclick="document.querySelector(\'#role\').value=\'admin\';switchRole(\'admin\')">Open Admin demo</button></div>';return}app.innerHTML=`<div class="wrap page"><div class="eyebrow">Admin demo · Editorial review</div><h2>Good knowledge begins with review.</h2><p class="muted">Check the submitted evidence, then decide what becomes public in this browser-local demo.</p><div class="adminstats"><div><strong>${submissions.filter(s=>s.status==='Pending review').length}</strong><small>Awaiting review</small></div><div><strong>${submissions.filter(s=>s.status==='Published').length}</strong><small>Published in demo</small></div><div><strong>${submissions.filter(s=>s.status==='Changes requested').length}</strong><small>Changes requested</small></div></div><p class="notice">Switching workspaces demonstrates permissions; it is not real authentication. Admin approval here does not constitute factual or ritual verification.</p><h3>Review queue</h3>${submissions.filter(s=>s.status==='Pending review').map(s=>record(s,true)).join('')||'<div class="empty">The queue is clear. Submit a source or temple from the Member workspace to test review.</div>'}<h3>Recent decisions</h3>${submissions.filter(s=>!['Pending review','Draft'].includes(s.status)).map(s=>record(s,true)).join('')||'<p class="muted">No decisions yet.</p>'}</div>`}
function decide(id,status){const s=submissions.find(s=>s.id===id);let reason='';if(status!=='Published'){reason=prompt('Add a reason for the member:');if(!reason?.trim())return}s.status=status;s.reason=reason;persist();admin();toast(status==='Published'?'Published in this demo. Source verification remains separate.':status)}
function practices(){const categories=[['Worship and pradakshina','Document local routes, permitted offerings and worship procedures with appropriate confirmation.'],['Temple etiquette','Share sourced dress, footwear, photography and queue instructions.'],['Cleanliness and care','Document approved cleaning activities, waste handling and responsible offerings.'],['Prasadam and annadanam','Record verified availability, distribution details and participation contacts.'],['Seva and community','Describe permitted activities and how to contact the temple to participate.'],['Chanting and traditions','Attach sourced hymns and local traditions; seek priest confirmation where required.']];app.innerHTML=`<div class="wrap page"><div class="eyebrow">Practices and participation</div><h1>A respectful visit.<br>An informed community.</h1><p class="muted" style="max-width:700px">A dedicated space for the everyday practices that bring temple life together. Each temple can carry its own instructions, references and community suggestions.</p><div class="filter"><span class="pill">Temple confirmed</span><span class="pill">General guidance</span><span class="pill">Community suggestion</span></div><p class="notice">The cards below explain contribution categories. They are not official instructions for any temple.</p><div class="grid" style="margin-top:30px">${categories.map(([title,desc],i)=>`<article class="panel"><div class="eyebrow">0${i+1} / Practice library</div><h3>${title}</h3><p class="muted">${desc}</p><button class="textbtn" onclick="mode='practice';go('contribute')">Suggest a practice ↗</button></article>`).join('')}</div></div>`}

async function dbGet(k){const db=await dbPromise;return new Promise((resolve,reject)=>{const r=db.transaction('data').objectStore('data').get(k);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function dbPut(k,v){const db=await dbPromise;return new Promise((resolve,reject)=>{const tx=db.transaction('data','readwrite');tx.objectStore('data').put(v,k);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error)})}
const curatedTemples=temples;temples=function(){const curated=curatedTemples(),ids=new Set(curated.map(t=>t.id));return [...curated,...nationalRecords.filter(t=>!ids.has(t.id)&&!t.linkedCurated)]};
const cleanText=v=>String(v||'').trim();
function convertOSM(elements,state=''){return elements.filter(e=>["node","way","relation"].includes(e.type)&&Number.isSafeInteger(e.id)&&e.tags&&(e.tags.religion==='hindu'||e.tags['religion:hindu']==='yes')&&(e.tags.amenity==='place_of_worship'||e.tags.building==='temple')).map(e=>{const a=e.tags,lat=e.lat??e.center?.lat,lon=e.lon??e.center?.lon;return {id:'osm-'+e.type+'-'+e.id,osmType:e.type,osmId:e.id,name:a['name:en']||a.name||'Unnamed Hindu temple',named:!!(a.name||a['name:en']),nativeName:a.name||'',aliases:Object.entries(a).filter(([k])=>k.startsWith('name:')||k==='alt_name').map(([,v])=>v),state:a['addr:state']||state||'Not recorded',district:a['addr:district']||'Not recorded',city:a['addr:city']||a['addr:town']||a['addr:village']||'Not recorded',locality:[a['addr:street'],a['addr:suburb'],a['addr:city']||a['addr:village']].filter(Boolean).join(', ')||'Locality not recorded',deity:a.deity||a.dedication||'Not recorded',tradition:a.denomination||'Not recorded',lat,lon,wikidata:/^Q\d+$/.test(a.wikidata||'')?a.wikidata:null,wikipedia:a.wikipedia||null,commons:a.wikimedia_commons||null,mappedImage:a.image&&validURL(a.image)?a.image:null,website:a.website||a['contact:website']||null,source:'OpenStreetMap',sourceURL:'https://www.openstreetmap.org/'+e.type+'/'+e.id,tags:a,images:[],note:'Source-backed map record. Historical details and temple-specific instructions have not been confirmed.',verification:'mapped_not_temple_confirmed',locationBasis:e.type==='node'?'mapped_point':'geometry_center',importedAt:new Date().toISOString()}})}
function mergeRecords(records){const map=new Map(nationalRecords.map(t=>[t.id,t]));for(const t of records){if(!t.id||!t.name)continue;const match=seeds.find(s=>t.wikidata&&s._document?.extensions?.wikidata_id===t.wikidata);if(match)t.linkedCurated=match.id;const prior=map.get(t.id);map.set(t.id,{...prior,...t,images:t.images?.length?t.images:prior?.images||[]})}return [...map.values()]}
async function overpass(query){const endpoints=['https://overpass-api.de/api/interpreter','https://overpass.kumi.systems/api/interpreter'];let error;for(const endpoint of endpoints){try{const r=await fetch(endpoint,{method:'POST',body:new URLSearchParams({data:query}),signal:AbortSignal.timeout(150000)});if(!r.ok)throw Error('Overpass responded '+r.status);const d=await r.json();if(d.remark)throw Error(d.remark);if(!Array.isArray(d.elements))throw Error('Invalid Overpass response');return d}catch(e){error=e}}throw error}
async function getRegions(){const q='[out:json][timeout:90];area["ISO3166-1"="IN"]["admin_level"="2"]->.india;rel["boundary"="administrative"]["admin_level"="4"](area.india);out tags;';try{const d=await overpass(q);const r=d.elements.filter(x=>x.tags?.['ISO3166-2']?.startsWith('IN-')).map(x=>({id:x.id,name:x.tags['name:en']||x.tags.name}));if(!r.length)throw Error('No states returned');return r.sort((a,b)=>a.name.localeCompare(b.name))}catch{return regionsFallback.map(name=>({name,id:null}))}}
function stateQuery(region){const select=region.id?`rel(${region.id});map_to_area->.state;`:`area["ISO3166-1"="IN"]["admin_level"="2"]->.india;rel["boundary"="administrative"]["admin_level"="4"]["name"=${JSON.stringify(region.name)}](area.india);map_to_area->.state;`;return '[out:json][timeout:120];'+select+'(nwr["amenity"="place_of_worship"]["religion"="hindu"](area.state);nwr["building"="temple"]["religion"="hindu"](area.state););out center tags;'}
function importProgress(text){const b=document.querySelector('#import-progress');if(b)b.textContent=text;const c=document.querySelector('#national-count');if(c)c.textContent=nationalRecords.length.toLocaleString()+' OSM records stored in this browser'}
async function importIndia(){if(nationalBusy)return; nationalBusy=true;nationalStopped=false;try{importProgress('Finding India’s state boundaries…');const regions=await getRegions();const failed=[];for(let i=0;i<regions.length&&!nationalStopped;i++){const region=regions[i];if(nationalJobs[region.name]?.status==='complete')continue;importProgress('Importing '+region.name+' · '+(i+1)+' of '+regions.length+' · '+nationalRecords.length.toLocaleString()+' records saved');try{const d=await overpass(stateQuery(region));if(!d.elements.length)throw Error('No data returned; this boundary needs checking.');const records=convertOSM(d.elements,region.name);const next=mergeRecords(records);await dbPut('records',next);nationalRecords=next;nationalJobs[region.name]={status:'complete',count:records.length,checkedAt:new Date().toISOString(),osmTimestamp:d.osm3s?.timestamp_osm_base};await dbPut('jobs',nationalJobs);importProgress(region.name+' saved · '+records.length.toLocaleString()+' records');}catch(e){failed.push(region.name);if(e.message.includes('429'))nationalStopped=true;nationalJobs[region.name]={status:'failed',error:e.message};await dbPut('jobs',nationalJobs);importProgress(region.name+' could not be imported: '+e.message)}await new Promise(r=>setTimeout(r,1300))}importProgress(nationalStopped?'Paused. Imported states are saved; use Resume to continue.':failed.length?'Import finished with '+failed.length+' failed states. Retry to complete them.':'All returned state queries completed. '+nationalRecords.length.toLocaleString()+' OSM records saved.');if((location.hash.slice(1)||'discover')==='discover')discover();if(!nationalStopped&&nationalRecords.some(t=>!t.photoChecked&&(t.wikidata||t.commons?.startsWith('File:'))))await enrichNationalImages(true);}catch(e){importProgress('Import could not continue: '+e.message)}finally{nationalBusy=false;renderImportButtons()}}
function stopIndia(){nationalStopped=true;importProgress('Pausing after the current request…')}
function renderImportButtons(){document.querySelectorAll('[data-import-start]').forEach(b=>b.disabled=nationalBusy||nationalPhotoBusy);document.querySelectorAll('[data-import-stop]').forEach(b=>b.disabled=!nationalBusy&&!nationalPhotoBusy)}
function nationalPanel(){return `<div class="national-panel"><div><div class="eyebrow">India temple data</div><h3>Expand the directory from OpenStreetMap</h3><p class="muted">Import Hindu temple records state by state. Completed states are saved here and skipped when you resume. After the import, linked Wikidata and Commons references are checked for licensed photographs.</p><p id="national-count" class="help">${nationalRecords.length.toLocaleString()} OSM records stored in this browser · ${Object.values(nationalJobs).filter(j=>j.status==='complete').length} completed state imports</p></div><div><div class="actions"><button class="btn" data-import-start ${nationalBusy?'disabled':''} onclick="importIndia()">${Object.keys(nationalJobs).length?'Resume / retry India import':'Import India temples'} ↗</button><button class="btn secondary" data-import-stop ${nationalBusy?'':'disabled'} onclick="stopIndia()">Pause</button></div><div class="actions"><label class="btn secondary small" style="cursor:pointer">Upload OSM JSON<input type="file" accept=".json,application/json" style="display:none" onchange="uploadNational(this.files[0]);this.value='' "></label><button class="textbtn" onclick="exportNational()">Export loaded records ↧</button><button class="textbtn" onclick="enrichNationalImages()">Find available wiki images</button></div><p id="import-progress" class="help" role="status">${nationalBusy?'Import running…':'Ready. Imports depend on the external map servers; leave this page open while importing.'}</p><details><summary>Import status by state</summary><div class="import-state-list">${Object.entries(nationalJobs).map(([state,j])=>`<p><strong>${esc(state)}</strong> · ${esc(j.status)} · ${j.count??0} records${j.error?' · '+esc(j.error):''}</p>`).join('')||'<p class="help">No state imports have run yet.</p>'}</div></details><details><summary>How the national data is added</summary><p class="help">OpenStreetMap supplies mapped identity, tags and coordinates. The importer includes Hindu places of worship and buildings tagged as Hindu temples. Images are added only through mapped Commons references or a linked Wikidata item. Unnamed records stay unnamed; deity and contact details are not guessed. OSM objects are deduplicated by type and ID; separate mapped objects may still describe the same temple and need review.</p><p class="help">Storage is local to this browser, not a shared national database. If the API is unavailable, run the state query in Overpass Turbo, export raw JSON and upload it here.</p><a target="_blank" rel="noopener noreferrer" href="https://overpass-turbo.eu/?Q=${encodeURIComponent('[out:json][timeout:180];area["ISO3166-1"="IN"]["admin_level"="2"]->.india;nwr["amenity"="place_of_worship"]["religion"="hindu"](area.india);out center tags;')}">Open India export query ↗</a></details></div></div>`}
async function uploadNational(file){if(!file)return;try{const d=JSON.parse(await file.text());let records;if(Array.isArray(d.elements))records=convertOSM(d.elements);else if(Array.isArray(d.records))records=d.records.filter(t=>/^osm-(node|way|relation)-[0-9]+$/.test(t.id||'')&&t.source==='OpenStreetMap').map(t=>({...t,_document:undefined,linkedCurated:undefined,aliases:Array.isArray(t.aliases)?t.aliases:[],images:Array.isArray(t.images)?t.images:[]}));else throw Error('Upload an Overpass JSON export or this directory’s exported OSM records.');if(!records.length)throw Error('No Hindu temple records found in this file.');for(const t of records){if(t.images)t.images=t.images.filter(im=>validURL(im.url)).map(im=>({...im,license_url:validURL(im.license_url||'')?im.license_url:null}));t.name=String(t.name);t.state=String(t.state||'Not recorded');}const next=mergeRecords(records);await dbPut('records',next);nationalRecords=next;discover();toast(records.length.toLocaleString()+' source records imported')}catch(e){toast('Import failed: '+e.message)}}
function exportNational(){const data={schema_version:'1.0.0',collection:'temples',created_at:new Date().toISOString(),record_count:nationalRecords.length,license:'ODbL 1.0',attribution:'© OpenStreetMap contributors',imports:nationalJobs,records:nationalRecords};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='India_OSM_Temple_Records.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
const nationalDiscover=discover;discover=function(){nationalDiscover();const directory=document.querySelector('#directory');directory.insertAdjacentHTML('afterbegin',nationalPanel());const states=[...new Set(temples().map(t=>t.state).filter(Boolean))].sort();const districts=[...new Set(temples().filter(t=>!stateFilter||t.state===stateFilter).map(t=>t.district||t._document?.location.district).filter(Boolean))].sort();const cities=[...new Set(temples().filter(t=>(!stateFilter||t.state===stateFilter)&&(!extraFilters.district||(t.district||t._document?.location.district)===extraFilters.district)).map(t=>t.city||t._document?.location.locality).filter(Boolean))].sort();const deities=[...new Set(temples().map(t=>t.deity).filter(Boolean))].sort();document.querySelector('.filter').innerHTML=`<label>State<select onchange="stateFilter=this.value;extraFilters.district='';extraFilters.city='';resultPage=1;discover()"><option value="">All states</option>${opts(states,stateFilter)}</select></label><label>District<select onchange="extraFilters.district=this.value;extraFilters.city='';resultPage=1;discover()"><option value="">All districts</option>${opts(districts,extraFilters.district)}</select></label><label>Locality or city<select onchange="extraFilters.city=this.value;resultPage=1;updateResults()"><option value="">All localities</option>${opts(cities,extraFilters.city)}</select></label><label>Deity<select onchange="deityFilter=this.value;resultPage=1;updateResults()"><option value="">All recorded deities</option>${opts(deities,deityFilter)}</select></label><label>Data source<select onchange="extraFilters.source=this.value;resultPage=1;updateResults()"><option value="">All sources</option>${opts(['Wikipedia','OpenStreetMap','Member contribution'],extraFilters.source)}</select></label><label>Photographs<select onchange="extraFilters.photo=this.value;resultPage=1;updateResults()"><option value="">With or without photos</option><option value="yes" ${extraFilters.photo==='yes'?'selected':''}>Photos available</option><option value="no" ${extraFilters.photo==='no'?'selected':''}>Needs photographs</option></select></label><label>Record name<select onchange="extraFilters.named=this.value;resultPage=1;updateResults()"><option value="">Named and unnamed</option><option value="yes" ${extraFilters.named==='yes'?'selected':''}>Named temples</option><option value="no" ${extraFilters.named==='no'?'selected':''}>Unnamed records</option></select></label><button class="textbtn" onclick="query='';stateFilter='';deityFilter='';extraFilters={district:'',city:'',source:'',photo:'',named:''};resultPage=1;discover()">Reset all filters</button>`;document.querySelector('#results').insertAdjacentHTML('afterend','<div id="pagination" class="actions"></div>');updateResults();renderImportButtons()};
function filterTemples(){return temples().filter(t=>{const source=t._document?'Wikipedia':t.source||'Member contribution',district=t.district||t._document?.location.district,city=t.city||t._document?.location.locality,hasPhotos=!!(templeMedia(t).profile||templeMedia(t).collection.length),named=t.named!==false;return (!stateFilter||t.state===stateFilter)&&(!deityFilter||t.deity===deityFilter)&&(!extraFilters.district||district===extraFilters.district)&&(!extraFilters.city||city===extraFilters.city)&&(!extraFilters.source||source===extraFilters.source)&&(!extraFilters.photo||(extraFilters.photo==='yes')===hasPhotos)&&(!extraFilters.named||(extraFilters.named==='yes')===named)&&[t.name,t.nativeName,t.locality,t.state,t.deity,t.district,t.city,...(t.aliases||[])].join(' ').toLowerCase().includes(query.toLowerCase())})}
updateResults=function(){const ts=filterTemples(),pages=Math.max(1,Math.ceil(ts.length/18));resultPage=Math.min(Math.max(1,resultPage),pages);const slice=ts.slice((resultPage-1)*18,resultPage*18);document.querySelector('#count').textContent=ts.length.toLocaleString()+' entries · page '+resultPage+' of '+pages;document.querySelector('#results').innerHTML=slice.length?slice.map(card).join(''):'<div class="empty full">No matching entries are loaded. Reset the filters or import more records.</div>';const p=document.querySelector('#pagination');if(p)p.innerHTML=`<button class="btn secondary small" ${resultPage===1?'disabled':''} onclick="resultPage--;updateResults()">← Previous</button><span>Page ${resultPage} of ${pages}</span><button class="btn secondary small" ${resultPage===pages?'disabled':''} onclick="resultPage++;updateResults()">Next →</button>`};
const nationalCard=card;card=function(t){let h=nationalCard(t);if(t.source==='OpenStreetMap')h=h.replace('Sample listing','OpenStreetMap').replace('Deity not provided','Deity not recorded');return h};
async function wikiJSON(url){const r=await fetch(url,{signal:AbortSignal.timeout(30000)});if(!r.ok)throw Error('Wiki API '+r.status);const d=await r.json();if(d.error)throw Error(d.error.info||'Wiki API error');return d}
const stripHTML=t=>{const d=document.createElement('div');d.innerHTML=String(t||'');return d.textContent||''};
async function fetchCommonsImages(titles){if(!titles.length)return [];const d=await wikiJSON('https://commons.wikimedia.org/w/api.php?'+new URLSearchParams({action:'query',format:'json',origin:'*',prop:'imageinfo',iiprop:'url|extmetadata',iiurlwidth:'960',titles:titles.slice(0,20).map(t=>'File:'+t.replace(/^File:/,'')).join('|')}));return Object.values(d.query?.pages||{}).flatMap(p=>{const info=p.imageinfo?.[0],meta=info?.extmetadata,license=stripHTML(meta?.LicenseShortName?.value);if(!info||!/(CC BY|CC0|public domain|Public domain)/i.test(license))return [];return [{url:info.thumburl||info.url,original_url:info.url,caption:p.title.replace(/^File:/,''),source:info.descriptionurl,credit:stripHTML(meta?.Artist?.value)||'Credit on original source',license,license_url:validURL(meta?.LicenseUrl?.value||'')?meta.LicenseUrl.value:null,use:'gallery',modifications:'Responsive display; profile view may crop image.'}]})}
async function enrichOne(t,save=true){if(t.photoChecked)return t.images||[];let files=[];if(t.commons?.startsWith('File:'))files.push(t.commons.slice(5));if(t.wikidata){const d=await wikiJSON('https://www.wikidata.org/w/api.php?'+new URLSearchParams({action:'wbgetentities',ids:t.wikidata,props:'claims|sitelinks',format:'json',origin:'*'}));const e=d.entities?.[t.wikidata];files.push(...(e?.claims?.P18||[]).map(p=>p.mainsnak?.datavalue?.value).filter(Boolean));t.wikiArticle=e?.sitelinks?.enwiki?.title||null;}const images=await fetchCommonsImages([...new Set(files)].slice(0,4));if(images[0])images[0].use='profile';t.images=images;t.photoChecked=true;t.photoCheckedAt=new Date().toISOString();if(save)await dbPut('records',nationalRecords);return images}
async function enrichNationalImages(fromImport=false){if(nationalPhotoBusy){toast('Photo enrichment is already running');return}const candidates=nationalRecords.filter(t=>!t.photoChecked&&(t.wikidata||t.commons?.startsWith('File:')));if(!candidates.length){toast('No new linked wiki image references are available in the loaded records.');return}nationalPhotoBusy=true;if(!fromImport)nationalStopped=false;renderImportButtons();let found=0,failed=0;try{for(let i=0;i<candidates.length&&!nationalStopped;i++){const t=candidates[i];importProgress('Checking wiki images · '+(i+1)+' of '+candidates.length+' · '+found+' temples enriched');try{if((await enrichOne(t,false)).length)found++;if(i%25===0)await dbPut('records',nationalRecords)}catch(e){failed++;if(e.message.includes('429')){nationalStopped=true;importProgress('Wiki requests paused because the source is rate limiting. Resume later.')}}await new Promise(r=>setTimeout(r,350))}await dbPut('records',nationalRecords);importProgress((nationalStopped?'Image check paused: ':'Image check complete: ')+found+' temples enriched; '+failed+' requests failed. Other temples need a sourced photo contribution.');if((location.hash.slice(1)||'discover')==='discover')discover()}finally{nationalPhotoBusy=false;renderImportButtons()}}
const nationalDetail=detail;detail=function(id){nationalDetail(id);const t=temples().find(t=>t.id===decodeURIComponent(id));if(!t||t.source!=='OpenStreetMap')return;document.querySelector('#overview').innerHTML=`<div class="eyebrow">OpenStreetMap sourced record</div><h2>At a glance</h2><p class="serif">${esc(t.nativeName)}</p><dl class="facts">${[['State',t.state],['District',t.district],['Locality',t.city],['Deity',t.deity],['Tradition',t.tradition],['OSM object',t.osmType+'/'+t.osmId]].map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl><p class="notice">Mapped identity and coordinates. History and rituals need additional evidence. ${t.locationBasis==='geometry_center'?'The map marker is a computed geometry centre.':''}</p>`;document.querySelector('#references').insertAdjacentHTML('afterbegin',`<div class="panel"><h3>OpenStreetMap record</h3><a href="${esc(safeUrl(t.sourceURL))}" target="_blank" rel="noopener noreferrer">Open mapped temple ↗</a><p class="help">© OpenStreetMap contributors · <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">ODbL</a> · Imported ${esc(t.importedAt?.slice(0,10))}</p></div>`);document.querySelector('.detail-layout aside').innerHTML=`<div class="panel"><h3>Mapped location</h3>${Number.isFinite(t.lat)&&Number.isFinite(t.lon)?`<a href="https://www.openstreetmap.org/?mlat=${t.lat}&mlon=${t.lon}#map=17/${t.lat}/${t.lon}" target="_blank" rel="noopener noreferrer">View map ↗</a>`:'<p>Coordinates not available.</p>'}${validURL(t.website||'')?`<p><a href="${esc(safeUrl(t.website))}" target="_blank" rel="noopener noreferrer">Website recorded in OSM ↗</a></p>`:''}</div><div class="panel"><h3>Temple photographs</h3><p class="help">Find licensed images from an exact mapped Commons reference or linked Wikidata record.</p><button class="btn secondary small" onclick="enrichCurrentTemple('${esc(t.id)}')">Find wiki photographs ↗</button><button class="textbtn" onclick="startPhotos('${esc(t.id)}')">Contribute photographs</button></div>`;if(!t.images.length&&(t.wikidata||t.commons?.startsWith('File:'))&&!t.photoChecked)enrichCurrentTemple(t.id,true)};
async function enrichCurrentTemple(id,quiet=false){const t=nationalRecords.find(t=>t.id===id);if(!t)return;try{const images=await enrichOne(t);if(location.hash.startsWith('#temple/'+id)&&images.length)detail(id);if(!quiet)toast(images.length?images.length+' licensed wiki images added':'No reusable image was found. Add a photograph with its source and credit.')}catch{if(!quiet)toast('Wiki image service unavailable. Try again or submit a photo URL.')}}
(async()=>{try{nationalRecords=await dbGet('records')||[];nationalJobs=await dbGet('jobs')||{};if((location.hash.slice(1)||'discover')==='discover')discover();else if(location.hash.startsWith('#temple/'))render()}catch{toast('National data storage is unavailable in this browser. The six curated profiles remain available.')}})();

</script></body></html>
